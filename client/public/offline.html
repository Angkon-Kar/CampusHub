<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>You are offline | Campus Hub</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfbfe; color: #0f172a; font-family: Inter, "Segoe UI", Arial, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; text-align: center; }
      .logo { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px; background: linear-gradient(135deg, #6366f1, #4338ca); display: grid; place-items: center; font-size: 30px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 24px; color: #64748b; line-height: 1.6; }
      button { background: #4f46e5; color: #fff; border: 0; border-radius: 12px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">&#128218;</div>
      <h1>You are offline</h1>
      <p>Campus Hub could not reach the internet. The CGPA calculator and the Syllabus Tracker still work if you opened them before. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
